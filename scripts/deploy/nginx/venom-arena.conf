# Venom Arena — nginx reverse proxy (T5 deploy kit)
# Copy to /etc/nginx/sites-available/venom-arena + symlink into sites-enabled.
#
# Three things matter beyond a plain proxy:
#   1. Game WebSocket routing: the client opens a raw WebSocket to
#      "/?XTransformPort=3001" (same-origin, any path + query param).
#      That convention is understood by the sandbox preview proxy but NOT
#      by stock nginx — so we route any request carrying the query param
#      to the game server (:3001) ourselves. Without this, production
#      multiplayer silently breaks (the handshake hits Next.js, which has
#      no WebSocket server).
#   2. WebSocket upgrade headers must be set wherever game sockets travel
#      (the /_game_ws + /socket.io/ locations below).
#   3. Uploads: avatar/skin uploads ride the same origin — keep a sane
#      client_max_body_size.
#
# TLS: terminate here (certbot --nginx), the upstreams stay plain HTTP on
# loopback. The Capacitor release shell points at https://<this domain>.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _; # <- replace with your domain, e.g. play.venomarena.gg

    client_max_body_size 20m;

    # Game WebSocket: raw WS carrying ?XTransformPort= query -> :3001
    location / {
        if ($arg_XTransformPort) {
            rewrite ^ /_game_ws last;
        }
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;           # WS handshake (safety net)
        proxy_set_header   Connection $connection_upgrade;  # WS keepalive (safety net)
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;  # long-lived game sockets
        proxy_send_timeout 300s;
    }

    # Internal target for the rewrite above (+ any socket.io polling fallback)
    location = /_game_ws {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_read_timeout 300s;
    }
}
