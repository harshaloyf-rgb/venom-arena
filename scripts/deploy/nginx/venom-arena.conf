# Venom Arena — nginx reverse proxy (T5 deploy kit)
# Copy to /etc/nginx/sites-available/venom-arena + symlink into sites-enabled.
#
# Two things matter beyond a plain proxy:
#   1. WebSocket upgrade: the game client connects same-origin with
#      /?XTransformPort=3001 (any path + query param), so Upgrade headers
#      must be set on the root location, not a dedicated /ws path.
#   2. Uploads: avatar/skin uploads ride the same origin — keep a sane
#      client_max_body_size.
#
# TLS: terminate here (certbot --nginx), the upstreams stay plain HTTP on
# loopback. The Capacitor release shell points at https://<this domain>.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _; # <- replace with your domain, e.g. play.venomarena.gg

    client_max_body_size 20m;

    # Next.js standalone (web + /api/*)
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;           # WS handshake
        proxy_set_header   Connection $connection_upgrade;  # WS keepalive
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;  # long-lived game sockets
        proxy_send_timeout 300s;
    }
}
